(()=>{
const $=s=>document.querySelector(s);
let lang="en";try{lang=localStorage.getItem("cr7-lang")||(navigator.language.startsWith("ar")?"ar":"en")}catch(e){}
const tr=k=>D.i18n[lang][k],pk=o=>o[lang],esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function art(seed,label){let h=0;for(const c of seed+label)h=(h*31+c.charCodeAt(0))>>>0;const r=n=>(h=(h*1103515245+12345)>>>0,h%n);let g="";
for(let i=0;i<6;i++)g+=`<circle cx="${r(800)}" cy="${r(500)}" r="${50+r(220)}" fill="none" stroke="#C8A85A" stroke-opacity=".${1+r(4)}"/>`;
g+=`<path d="M0 ${300+r(120)}Q400 ${150+r(150)} 800 ${280+r(120)}" fill="none" stroke="#C8A85A" stroke-opacity=".35"/>`;
const fs=label.length>5?90:label.length>3?130:190;
return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211b0f"/><stop offset="1" stop-color="#090909"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/>${g}<text x="400" y="${250+fs/3}" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="${fs}" font-weight="800" fill="#C8A85A" fill-opacity=".22">${label}</text></svg>`)}
const Img=(it,alt)=>`<img src="${it.img||art(it.art,it.art)}" data-a="${esc(it.art)}" alt="${esc(alt)}" loading="lazy" decoding="async" width="800" height="500">`;
const Ph=(it,alt)=>`<div class="ph">${Img(it,alt)}${it.count?`<em>${esc(it.count)}</em>`:""}${it.img?"":`<span class="pl">${tr("ph")}</span>`}</div>`;
const Badge=it=>it.status==="ok"?`<small class="ok">✓ ${tr("checked")} · ${D.updated}</small>`:`<small class="flag">⚠ ${tr("verify")}</small>`;
const Src=it=>`<small><a href="${it.src}" target="_blank" rel="noopener">${tr("source")} ↗</a></small>`;
const Card=(it,i)=>{const t=pk(it.title);return `<button type="button" data-i="${i}" class="card reveal">${Ph(it,t)}<div class="cb"><h3>${esc(t)}</h3><span>${esc(it.years)}</span>${Badge(it)}</div></button>`};
function fill(id,list){$(id).innerHTML=list.map(Card).join("");$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>openDlg(list[b.dataset.i]))}
function openDlg(it){$("#dlg-t").textContent=pk(it.title);$("#dlg-d").textContent=[it.years,pk(it.text)].join(" — ");const a=$("#dlg-s");a.href=it.src;a.textContent=tr("source")+" ↗";$("#dlg").showModal()}
$("#dlg-x").onclick=()=>$("#dlg").close();$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

let tl=0;
function renderTimeline(){const T=D.timeline,c=T[tl];
$("#timeline-box").innerHTML=`<div class="tabs" role="tablist">${T.map((t,i)=>`<button role="tab" id="tab${i}" aria-selected="${i===tl}" aria-controls="tp" tabindex="${i===tl?0:-1}" data-i="${i}">${esc(t.years)}<br>${esc(pk(t.club))}</button>`).join("")}</div>
<div class="tl" id="tp" role="tabpanel" aria-labelledby="tab${tl}">${Ph(c,pk(c.club))}<div class="tx"><div class="yrs">${esc(c.years)}</div><h3>${esc(pk(c.club))}</h3><p>${esc(pk(c.text))}</p><a href="${c.src}" target="_blank" rel="noopener">${tr("source")} ↗</a></div></div>`;
const tabs=[...document.querySelectorAll(".tabs button")];
tabs.forEach((b,i)=>{b.onclick=()=>{tl=i;renderTimeline();$("#tab"+i).focus()};
b.onkeydown=e=>{const s={ArrowRight:lang==="ar"?-1:1,ArrowLeft:lang==="ar"?1:-1}[e.key];if(s){e.preventDefault();tl=(i+s+tabs.length)%tabs.length;renderTimeline();$("#tab"+tl).focus()}}})}

const F={club:"all",country:"all",era:"all"};
function renderGallery(){
$("#filters").innerHTML=["club","country","era"].map(k=>`<div class="chips" role="group" aria-label="${tr("f"+k[0].toUpperCase()+k.slice(1))}"><span>${tr("f"+k[0].toUpperCase()+k.slice(1))}</span>${["all",...Object.keys(D.L[k])].map(v=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${F[k]===v}">${v==="all"?tr("all"):esc(pk(D.L[k][v]))}</button>`).join("")}</div>`).join("");
$("#filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;renderGallery();observe()});
const list=D.gallery.filter(g=>Object.keys(F).every(k=>F[k]==="all"||g[k]===F[k]));
$("#count").textContent=`${tr("shown")} ${list.length} ${tr("of")} ${D.gallery.length}`;
$("#gallery-grid").innerHTML=list.map(g=>`<figure class="card reveal in" style="cursor:default">${Ph(g,pk(g.cap))}<figcaption class="cb"><h3>${esc(pk(g.cap))}</h3><span>${esc(pk(D.L.club[g.club]))} · ${esc(pk(D.L.country[g.country]))} · ${esc(pk(D.L.era[g.era]))}</span></figcaption></figure>`).join("");
fb()}
const fb=()=>document.querySelectorAll("img[data-a]").forEach(i=>i.onerror=()=>{i.onerror=null;i.src=art(i.dataset.a,i.dataset.a)});

function render(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=tr(e.dataset.i18n));
document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",tr(e.dataset.i18nAria)));
$("#lang").textContent=tr("langBtn");$("#lang").lang=lang==="ar"?"en":"ar";
$("#menu").innerHTML=D.nav.map(([id,k])=>`<a href="#${id}">${tr(k)}</a>`).join("");
$("#updated").textContent=D.updated;$("#updated").dateTime=D.updated;
$("#hero-bg").style.setProperty("--hero",`url("${art("hero","7")}")`);
renderTimeline();fill("#trophies-grid",D.trophies);fill("#portugal-grid",D.portugal);
$("#moments-grid").innerHTML=D.matches.map(m=>{const t=pk(m.title);return `<article class="card reveal">${Ph(m,t)}<div class="cb"><h3>${esc(t)}</h3><span>${esc(pk(m.date))}</span><p>${esc(pk(m.text))}</p>${Badge(m)}${Src(m)}</div></article>`}).join("");
$("#stats-grid").innerHTML=D.stats.map(s=>`<div class="card reveal"><b>${esc(s.value)}</b><h3>${esc(pk(s.label))}</h3><small>${tr("asOf")} ${esc(s.asOf)}</small>${s.note?`<small>${esc(pk(s.note))}</small>`:""}${Badge(s)}${Src(s)}</div>`).join("");
$("#sources").innerHTML=D.sources.map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${n}</a></li>`).join("");
renderGallery();fb();observe()}
const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08}):null;
const observe=()=>document.querySelectorAll(".reveal:not(.in)").forEach(e=>io?io.observe(e):e.classList.add("in"));
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("cr7-lang",lang)}catch(e){}render()};
const bg=$("#burger"),mn=$("#menu"),close=()=>{mn.classList.remove("open");bg.setAttribute("aria-expanded",false)};
bg.onclick=()=>{bg.setAttribute("aria-expanded",mn.classList.toggle("open"))};
mn.onclick=e=>{if(e.target.tagName==="A")close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
render();
})();
</script>
